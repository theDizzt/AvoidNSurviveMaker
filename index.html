<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avoid N Survive</title>
  </head>
  <body>
    <div id="app-bg" class="app-bg" data-mode="demo" aria-hidden="true"><canvas id="demo-bg"></canvas></div>

    <!-- Preloading screen -->
    <div id="preload-screen" class="screen preload" role="status" aria-live="polite">
      <div class="preload-inner">
        <div class="logo logo-3d" role="img" aria-label="Avoid N Survive"><span class="logo-layer logo-back" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span><span class="logo-layer logo-mid" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span><span class="logo-layer logo-front" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span></div>
        <div class="progress" aria-hidden="true"><div id="preload-bar" class="progress-bar"></div></div>
        <p id="preload-text" class="preload-text" data-i18n="common.loading"></p>
        <p id="preload-version" class="menu-foot"></p>
      </div>
    </div>

    <!-- Main menu -->
    <div id="menu-screen" class="screen menu" hidden>
      <div id="account-bar" class="account-bar"></div>
      <div class="menu-inner menu-diamonds">
        <h1 class="logo logo-3d" aria-label="Avoid N Survive"><span class="logo-layer logo-back" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span><span class="logo-layer logo-mid" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span><span class="logo-layer logo-front" aria-hidden="true">Avoid <b class="logo-n">N</b> Survive</span></h1>
        <p class="tagline" data-i18n="menu.tagline"></p>
        <!-- A grid turned 45°: every cell is a diamond; Start Game spans 2×2 -->
        <nav class="dia-wrap" id="menu-dia" data-i18n-aria-label="menu.mainMenu">
          <div class="dgrid" style="--cols: 4">
            <button type="button" id="menu-start" class="dtile dtile-primary" style="grid-column: 1 / span 2; grid-row: 1 / span 2">
              <span class="dtile-in"><strong data-i18n="menu.start"></strong></span>
            </button>
            <button type="button" id="menu-editor" class="dtile" style="grid-column: 3; grid-row: 1">
              <span class="dtile-in"><strong data-i18n="menu.editor"></strong></span>
            </button>
            <button type="button" id="menu-theme-editor" class="dtile" style="grid-column: 3; grid-row: 2">
              <span class="dtile-in"><strong data-i18n="common.themeEditor"></strong></span>
            </button>
            <button type="button" id="menu-achievements" class="dtile" style="grid-column: 4; grid-row: 1">
              <span class="dtile-in"><strong data-i18n="menu.achievements"></strong></span>
            </button>
            <button type="button" id="menu-stats" class="dtile" style="grid-column: 4; grid-row: 2">
              <span class="dtile-in"><strong data-i18n="menu.stats"></strong></span>
            </button>
            <button type="button" id="menu-options" class="dtile" style="grid-column: 1; grid-row: 3">
              <span class="dtile-in"><strong data-i18n="menu.options"></strong></span>
            </button>
            <button type="button" id="menu-customize" class="dtile" style="grid-column: 2; grid-row: 3">
              <span class="dtile-in"><strong data-i18n="menu.customize"></strong></span>
            </button>
            <span class="dtile dtile-deco" style="grid-column: 3; grid-row: 3" aria-hidden="true"></span>
            <span class="dtile dtile-stars" style="grid-column: 4; grid-row: 3">
              <span class="dtile-in"><strong id="menu-stars">0</strong><small data-i18n="menu.stars"></small></span>
            </span>
          </div>
        </nav>
        <p id="menu-version" class="menu-foot"></p>
      </div>
    </div>

    <!-- Campaign: world (theme) select and level select, built by campaign-ui.ts -->
    <div id="themes-screen" class="screen menu dscreen" hidden></div>
    <div id="levels-screen" class="screen menu dscreen" hidden></div>
    <!-- Theme editor: built by theme-editor.ts -->
    <div id="theme-editor-screen" class="screen menu dscreen te-screen" hidden></div>

    <!-- Account: sign in / create account -->
    <div id="auth-screen" class="screen menu" hidden>
      <div class="menu-inner auth-card">
        <h2 class="logo logo-sm" data-i18n="common.account"></h2>
        <div class="auth-tabs" role="tablist" data-i18n-aria-label="common.account">
          <button type="button" role="tab" id="tab-signin" aria-selected="true" data-i18n="auth.signIn"></button>
          <button type="button" role="tab" id="tab-signup" aria-selected="false" data-i18n="auth.createAccount"></button>
        </div>
        <p id="auth-unconfigured" class="form-note" hidden data-i18n="auth.unconfiguredNote"></p>

        <form id="signin-form" class="auth-form" novalidate>
          <label class="field wide"><span data-i18n="auth.email"></span><input type="email" name="email" autocomplete="email" maxlength="254" /></label>
          <label class="field wide"><span data-i18n="auth.password"></span><input type="password" name="password" autocomplete="current-password" /></label>
          <div id="signin-captcha" class="captcha"></div>
          <p class="form-error" role="alert"></p>
          <button type="submit" class="menu-btn primary" data-i18n="auth.signIn"></button>
          <button type="button" id="signin-resend" class="link-btn" hidden data-i18n="auth.resendVerification"></button>
        </form>

        <form id="signup-form" class="auth-form" novalidate hidden>
          <label class="field wide"><span data-i18n="auth.email"></span><input type="email" name="email" autocomplete="email" maxlength="254" /></label>
          <label class="field wide"><span data-i18n="auth.password"></span><input type="password" name="password" autocomplete="new-password" /></label>
          <label class="field wide"><span data-i18n="auth.confirmPassword"></span><input type="password" name="confirm" autocomplete="new-password" /></label>
          <label class="field wide">
            <span data-i18n="auth.nickname"></span>
            <input type="text" name="nickname" autocomplete="nickname" spellcheck="false" />
          </label>
          <p class="nick-hint">
            <span><span data-i18n="auth.appearAs"></span><strong id="nick-preview">Nickname#????</strong></span>
            <span id="nick-bytes" class="nick-bytes"></span>
          </p>
          <p class="form-note" data-i18n="auth.passwordRule"></p>
          <div id="signup-captcha" class="captcha"></div>
          <p class="form-error" role="alert"></p>
          <button type="submit" class="menu-btn primary" data-i18n="auth.createAccount"></button>
        </form>

        <button type="button" id="auth-back" class="dback dback-center" data-i18n-title="auth.backToMenu"><span class="dtile-in"><strong data-i18n="common.back"></strong></span></button>
      </div>
    </div>

    <!-- After sign-up: verify email -->
    <div id="verify-screen" class="screen menu" hidden>
      <div class="menu-inner auth-card">
        <h2 class="logo logo-sm" data-i18n="auth.checkEmail"></h2>
        <p class="verify-text"><span data-i18n="auth.sentLinkTo"></span><strong id="verify-email"></strong><span data-i18n="auth.sentLinkAfter"></span></p>
        <p class="form-note" data-i18n="auth.didntGetIt"></p>
        <div id="verify-captcha" class="captcha"></div>
        <p class="form-error" role="alert"></p>
        <div class="menu-buttons">
          <button type="button" id="verify-signin" class="menu-btn primary" data-i18n="auth.goToSignIn"></button>
          <button type="button" id="verify-resend" class="menu-btn" data-i18n="auth.resend"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- Options -->
    <div id="options-screen" class="screen menu" hidden>
      <div class="menu-inner menu-diamonds">
        <h2 class="logo logo-sm" data-i18n="menu.options"></h2>
        <!-- Same 45°-turned grid as the main menu; menu music spans 2×2 -->
        <div class="dia-wrap" id="options-dia">
          <div class="dgrid dgrid-panel" style="--cols: 4">
            <div class="dtile dtile-music" style="grid-column: 1 / span 2; grid-row: 1 / span 2">
              <span class="dtile-in">
                <span class="dicon" aria-hidden="true">♪</span>
                <strong data-i18n="options.menuMusic"></strong>
                <small id="menu-music-name" class="dmusic-name" role="status" data-i18n="music.none"></small>
                <span class="dpill-row">
                  <label class="dpill dpill-file"><input type="file" id="menu-music-file" class="visually-hidden" accept=".mp3,.ogg,.wav,.m4a,.aac,.flac" /><span data-i18n="options.chooseFile"></span></label>
                  <button type="button" id="menu-music-remove" class="dpill" data-i18n="options.reset"></button>
                </span>
              </span>
            </div>
            <label class="dtile dvolume" for="opt-master-volume" style="grid-column: 3; grid-row: 1">
              <span class="dtile-in">
                <strong data-i18n="options.master"></strong>
                <span class="ddial"><input type="range" id="opt-master-volume" class="visually-hidden" min="0" max="100" step="1" /></span>
                <output id="opt-master-volume-value" for="opt-master-volume">80%</output>
              </span>
            </label>
            <label class="dtile dvolume" for="opt-music-volume" style="grid-column: 4; grid-row: 1">
              <span class="dtile-in">
                <strong data-i18n="common.music"></strong>
                <span class="ddial"><input type="range" id="opt-music-volume" class="visually-hidden" min="0" max="100" step="1" /></span>
                <output id="opt-music-volume-value" for="opt-music-volume">60%</output>
              </span>
            </label>
            <label class="dtile dvolume" for="opt-effects-volume" style="grid-column: 3; grid-row: 2">
              <span class="dtile-in">
                <strong data-i18n="options.effects"></strong>
                <span class="ddial"><input type="range" id="opt-effects-volume" class="visually-hidden" min="0" max="100" step="1" /></span>
                <output id="opt-effects-volume-value" for="opt-effects-volume">80%</output>
              </span>
            </label>
            <div class="dtile drecords" style="grid-column: 4; grid-row: 2">
              <span class="dtile-in">
                <strong data-i18n="options.records"></strong>
                <small id="records-status" data-i18n="records.signedOut"></small>
                <button type="button" id="records-sync" class="dpill" disabled data-i18n="options.sync"></button>
              </span>
            </div>
            <label class="dtile dtoggle" style="grid-column: 1; grid-row: 3" data-i18n-title="options.trailHint">
              <span class="dtile-in"><input type="checkbox" id="opt-trail" /><strong data-i18n="options.trail"></strong></span>
            </label>
            <label class="dtile dtoggle" style="grid-column: 2; grid-row: 3" data-i18n-title="options.timerHint">
              <span class="dtile-in"><input type="checkbox" id="opt-timer" /><strong data-i18n="options.timer"></strong></span>
            </label>
            <label class="dtile dtoggle" style="grid-column: 3; grid-row: 3" data-i18n-title="options.debugHint">
              <span class="dtile-in"><input type="checkbox" id="opt-debug" /><strong data-i18n="options.debug"></strong></span>
            </label>
            <label class="dtile dlanguage" for="opt-language" style="grid-column: 4; grid-row: 3">
              <span class="dtile-in">
                <span class="dicon" aria-hidden="true">文</span>
                <strong data-i18n="options.language"></strong>
                <select id="opt-language" class="dpill"></select>
              </span>
            </label>
            <span class="dtile dtile-deco" style="grid-column: 1; grid-row: 4" aria-hidden="true"></span>
            <button type="button" id="options-reset" class="dtile" style="grid-column: 2; grid-row: 4">
              <span class="dtile-in"><strong data-i18n="options.reset"></strong><small data-i18n="options.resetSub"></small></span>
            </button>
            <button type="button" id="options-licenses" class="dtile" style="grid-column: 3; grid-row: 4">
              <span class="dtile-in"><strong data-i18n="options.licenses"></strong><small data-i18n="options.licensesSub"></small></span>
            </button>
            <button type="button" id="options-back" class="dtile dtile-primary dtile-back" style="grid-column: 4; grid-row: 4">
              <span class="dtile-in"><strong data-i18n="common.back"></strong></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats: account summary on the same diamond grid; Stars spans 2×2 -->
    <div id="stats-screen" class="screen menu" hidden>
      <div class="menu-inner menu-diamonds">
        <h2 class="logo logo-sm" data-i18n="menu.stats"></h2>
        <p id="stats-message" class="tagline stats-message" role="status"></p>
        <div class="dia-wrap" id="stats-dia">
          <div class="dgrid dgrid-panel" style="--cols: 4">
            <div class="dtile dtile-stars" style="grid-column: 1 / span 2; grid-row: 1 / span 2">
              <span class="dtile-in"><span class="dtotal-star" aria-hidden="true">★</span><strong data-stat="stars">—</strong><small data-stat="stars-note" data-i18n="menu.stars"></small></span>
            </div>
            <div class="dtile dstat" style="grid-column: 3; grid-row: 1">
              <span class="dtile-in"><small class="dstat-label" data-i18n="stats.player"></small><strong data-stat="player">—</strong><small data-stat="player-note"></small></span>
            </div>
            <div class="dtile dstat" style="grid-column: 4; grid-row: 1">
              <span class="dtile-in"><small class="dstat-label" data-i18n="stats.playTime"></small><strong data-stat="time">—</strong><small data-stat="time-note"></small></span>
            </div>
            <div class="dtile dstat dstat-mint" style="grid-column: 3; grid-row: 2">
              <span class="dtile-in"><small class="dstat-label" data-i18n="stats.cleared"></small><strong data-stat="cleared">—</strong><small data-stat="cleared-note"></small></span>
            </div>
            <div class="dtile dstat" style="grid-column: 4; grid-row: 2">
              <span class="dtile-in"><small class="dstat-label" data-i18n="stats.lastRecord"></small><strong data-stat="last">—</strong></span>
            </div>
            <span class="dtile dtile-deco" style="grid-column: 1; grid-row: 3" aria-hidden="true"></span>
            <div class="dtile dstat dstat-deaths" style="grid-column: 2; grid-row: 3">
              <span class="dtile-in"><small class="dstat-label" data-i18n="stats.colDeaths"></small><strong data-stat="deaths">—</strong><small data-stat="deaths-note"></small></span>
            </div>
            <button type="button" id="stats-refresh" class="dtile" style="grid-column: 3; grid-row: 3">
              <span class="dtile-in"><span class="dicon" aria-hidden="true">↻</span><strong data-i18n="stats.refresh"></strong></span>
            </button>
            <button type="button" id="stats-back" class="dtile dtile-primary dtile-back" style="grid-column: 4; grid-row: 3">
              <span class="dtile-in"><strong data-i18n="common.back"></strong></span>
            </button>
          </div>
        </div>
        <!-- Per-level record tables: hidden for now (StatsUI.SHOW_LEVEL_RECORDS) -->
        <div id="stats-records" class="stats-list" hidden></div>
      </div>
    </div>

    <div id="achievements-screen" class="screen menu" hidden>
      <div class="menu-inner">
        <h2 class="logo logo-sm" data-i18n="menu.achievements"></h2>
        <p class="muted" data-i18n="common.comingSoon"></p>
        <div class="menu-buttons">
          <button type="button" id="achievements-back" class="dback"><span class="dtile-in"><strong data-i18n="common.back"></strong></span></button>
        </div>
      </div>
    </div>

    <div id="customize-screen" class="screen menu" hidden>
      <div class="menu-inner">
        <h2 class="logo logo-sm" data-i18n="menu.customize"></h2>
        <p class="muted" data-i18n="common.comingSoon"></p>
        <div class="menu-buttons">
          <button type="button" id="customize-back" class="dback"><span class="dtile-in"><strong data-i18n="common.back"></strong></span></button>
        </div>
      </div>
    </div>

    <div id="licenses-screen" class="screen menu" hidden>
      <div class="menu-inner licenses-inner">
        <h2 class="logo logo-sm" data-i18n="options.licenses"></h2>
        <p class="muted licenses-intro" data-i18n="licenses.intro"></p>
        <div id="licenses-list" class="licenses-list"></div>
        <div class="menu-buttons">
          <button type="button" id="licenses-back" class="dback"><span class="dtile-in"><strong data-i18n="common.back"></strong></span></button>
        </div>
      </div>
    </div>

    <main>
      <!-- Play: the canvas takes the largest 16:9 area of the window. The HUD panel is not shown; its
           controls stay in the page as the state behind the keyboard shortcuts (R, N, F, Esc). -->
      <section id="play-view" class="play-view" hidden>
        <div class="stage play-stage"><canvas id="play-canvas" data-fit="screen"></canvas></div>
        <!-- Back to the level list (or the editor) before a run starts; hidden while running -->
        <button type="button" id="btn-play-back" class="play-back" title="Esc" data-i18n="common.back"></button>
        <div class="play-hud" hidden>
          <div class="hud-row">
            <select id="level-select" data-i18n-aria-label="play.selectMap"></select>
            <button type="button" id="btn-back-editor" hidden data-i18n="play.backToEditor"></button>
            <button type="button" id="btn-next-level" title="N" hidden data-i18n="play.nextLevel"></button>
            <button type="button" id="btn-play-edit" data-i18n="play.openInEditor"></button>
            <button type="button" id="btn-fullscreen" class="btn-fullscreen" title="F" data-i18n="common.fullscreen"></button>
            <button type="button" id="btn-play-menu" title="Esc" data-i18n="common.mainMenu"></button>
          </div>
          <p class="hud-keys" data-i18n="play.keys"></p>
          <p id="play-status" class="status"></p>
        </div>
        <details id="debug-panel" class="debug play-debug" open>
          <summary data-i18n="debug.title"></summary>
          <dl id="debug-stats"></dl>
          <p class="muted" data-i18n="debug.help"></p>
        </details>
      </section>

      <!-- Editor: same full-window 16:9 canvas as play; tools and properties float on top (H hides them) -->
      <section id="editor-view" class="editor-view" hidden>
        <div class="stage editor-stage"><canvas id="editor-canvas" data-fit="screen"></canvas></div>
        <div class="editor-bar">
          <button type="button" id="btn-test" class="primary" title="T" data-i18n="editor.testPlay"></button>
          <button type="button" id="btn-editor-menu" data-i18n-title="menu.mainMenu" data-i18n="common.mainMenu"></button>
          <span class="bar-sep" aria-hidden="true"></span>
          <label class="check" title="N"><input type="checkbox" id="opt-snap" checked /> <span data-i18n="editor.snap"></span></label>
          <label class="check" title="P"><input type="checkbox" id="opt-preview" /> <span data-i18n="editor.previewMotion"></span></label>
          <label class="check" data-i18n-title="editor.gridTopHint"><input type="checkbox" id="opt-grid-top" /> <span data-i18n="editor.gridTop"></span></label>
          <button type="button" id="btn-undo" title="Ctrl+Z" data-i18n="common.undo"></button>
          <button type="button" id="btn-redo" title="Ctrl+Y" data-i18n="common.redo"></button>
          <button type="button" id="btn-shortcuts" title="?" aria-pressed="false" data-i18n="editor.shortcuts"></button>
          <span class="bar-sep" aria-hidden="true"></span>
          <button type="button" id="btn-zoom-out" class="zoom-btn" data-i18n-title="editor.zoomOut">−</button>
          <button type="button" id="btn-zoom-reset" class="zoom-level" data-i18n-title="editor.zoomReset">100%</button>
          <button type="button" id="btn-zoom-in" class="zoom-btn" data-i18n-title="editor.zoomIn">+</button>
          <span class="bar-sep" aria-hidden="true"></span>
          <button type="button" id="btn-panels" title="H" aria-pressed="false" data-i18n="editor.hidePanels"></button>
          <button type="button" id="btn-editor-fullscreen" class="btn-fullscreen" title="F" data-i18n="common.fullscreen"></button>
        </div>
        <aside id="tools-panel" class="editor-float float-left" data-i18n-aria-label="common.tools">
          <div class="float-head" data-i18n-title="panel.moveHint">
            <span class="float-title" data-i18n="common.tools"></span>
            <button type="button" class="float-toggle" aria-expanded="true" data-i18n-title="panel.collapse">−</button>
          </div>
          <div id="palette" class="palette float-body"></div>
        </aside>
        <p id="editor-hint" class="editor-hint status"></p>
        <!-- Object options: the selected object's properties -->
        <aside id="object-panel" class="editor-float float-right float-object" data-i18n-aria-label="editor.object">
          <div class="float-head" data-i18n-title="panel.moveHint">
            <span class="float-title" data-i18n="editor.object"></span>
            <button type="button" class="float-toggle" aria-expanded="true" data-i18n-title="panel.collapse">−</button>
          </div>
          <div class="panel float-body">
            <section>
              <div id="props"></div>
            </section>
          </div>
        </aside>
        <!-- Level metadata: map info, level settings, theme, verify & share -->
        <aside id="level-info-panel" class="editor-float float-right" data-i18n-aria-label="common.level">
          <div class="float-head" data-i18n-title="panel.moveHint">
            <span class="float-title" data-i18n="common.level"></span>
            <button type="button" class="float-toggle" aria-expanded="true" data-i18n-title="panel.collapse">−</button>
          </div>
          <div class="panel float-body">
            <section>
              <h3 data-i18n="editor.mapInfo"></h3>
              <div class="fields">
                <label class="field wide"><span data-i18n="editor.fileName"></span><input id="map-name" maxlength="60" /></label>
                <label class="field wide"><span data-i18n="common.author"></span><input id="map-author" maxlength="60" /></label>
                <label class="field wide"><span data-i18n="editor.size"></span><select id="map-size"></select></label>
              </div>
            </section>
            <details class="theme-section" open>
              <summary><h3 data-i18n="editor.levelSettings"></h3></summary>
              <div id="level-panel"></div>
            </details>
            <details class="theme-section">
              <summary><h3 data-i18n="editor.theme"></h3></summary>
              <div id="theme-panel"></div>
            </details>
            <ul id="messages" class="messages"></ul>
            <section>
              <h3 data-i18n="editor.verifyShare"></h3>
              <p id="verify-status" class="verify"></p>
              <button type="button" id="btn-share" disabled data-i18n="editor.createShareLink"></button>
              <input id="share-url" readonly data-i18n-placeholder="editor.shareLinkPlaceholder" />
            </section>
            <section class="actions">
              <button type="button" id="btn-export" data-i18n="editor.exportJson"></button>
              <button type="button" id="btn-import" data-i18n="editor.importJson"></button>
              <input type="file" id="import-file" accept=".json,application/json" hidden />
              <button type="button" id="btn-new" class="danger" data-i18n="map.new"></button>
            </section>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
