# Builds the game and deploys it to Vercel on every push to main.
# Uses a Vercel token instead of Vercel's GitHub integration, so the Vercel project can belong to
# an account other than the repository owner.
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json (created by `vercel link`)
#   VERCEL_PROJECT_ID  "projectId" in the same file
# Supabase / Turnstile values come from the Vercel project's environment variables (vercel pull).
# The build command in vercel.json runs the tests first, so a failing test stops the deploy.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; a newer push cancels an older one still running
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deployment configuration
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel deployment skipped. Missing repository secrets: ${missing[*]}"
            {
              echo '### Vercel deployment was not performed'
              echo "Missing repository secrets: ${missing[*]}"
              echo 'Add these under Settings > Secrets and variables > Actions > Repository secrets, then rerun this workflow.'
              echo 'See docs/DEPLOYMENT.md for setup instructions.'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              echo '::error::Manual deployment requires all three Vercel secrets.'
              exit 1
            fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@66.0.0

      - name: Pull project settings and environment variables
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Test and build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
