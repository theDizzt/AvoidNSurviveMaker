# Builds the game and deploys it to Vercel on every push to main.
# Uses a Vercel token instead of Vercel's GitHub integration, so the Vercel project can belong to
# an account other than the repository owner.
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json (created by `vercel link`)
#   VERCEL_PROJECT_ID  "projectId" in the same file
# Supabase / Turnstile values come from the Vercel project's environment variables (vercel pull).
# The build command in vercel.json runs the tests first, so a failing test stops the deploy.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; a newer push cancels an older one still running
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings and environment variables
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Test and build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
